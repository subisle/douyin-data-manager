# ---------------------------------------------------------------------------
# RK3318 BOX (Rockchip RK3318 / aarch64) — Docker 29 自带 compose v2，无需 docker-compose 二进制
#
#   cp deploy/rk3318/.env.example deploy/rk3318/.env   # 然后填真实值
#   docker compose -f docker-compose.rk3318.yml up -d --build     # 盒子原生构建
#   docker compose -f docker-compose.rk3318.yml up -d             # 已 load 镜像
#   docker compose -f docker-compose.rk3318.yml run --rm web node scripts/migrate.js up
#
# 可选 profile：
#   --profile db    盒子没装 MySQL 时，用容器内 MySQL 8.4
#   --profile bot   跑 scripts/bot-worker.js（实验性，见 CLAUDE.md 第 4 节）
# ---------------------------------------------------------------------------

name: douyin-rk3318

x-app: &app
  image: douyin-data-manager:arm64
  build:
    context: .
    dockerfile: Dockerfile
    platforms:
      - linux/arm64
  platform: linux/arm64
  env_file:
    - deploy/rk3318/.env
  environment:
    TZ: Asia/Shanghai
    NODE_ENV: production
    PORT: "3000"
    NODE_OPTIONS: --max-old-space-size=1024
  volumes:
    - ${DOUYIN_DATA_DIR:-/srv/douyin}/runtime:/app/data/runtime
    - ${DOUYIN_DATA_DIR:-/srv/douyin}/artifacts:/var/lib/douyin/artifacts
    - ${DOUYIN_DATA_DIR:-/srv/douyin}/exports:/app/data/exports
    # 机器人配置与状态（微信凭据、QQ 多机器人配置、绑定用户）——挂出来才不会随容器重建丢失
    - ${DOUYIN_DATA_DIR:-/srv/douyin}/builtin:/app/data/builtin
    # 仓库不含字体（assets/fonts 被 gitignore），出图需要自己挂
    - ${DOUYIN_FONT_DIR:-./assets/fonts}:/app/assets/fonts:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    container_name: douyin-web
    command: npm run start
    labels:
      - autoheal=true
    ports:
      - "${DOUYIN_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: ${DOUYIN_WEB_MEM:-1024m}
    memswap_limit: ${DOUYIN_WEB_MEMSWAP:-1536m}

  # 健康检查 unhealthy 时自动重启 web 容器（崩溃重启由 restart: unless-stopped 覆盖）
  autoheal:
    image: willfarrell/autoheal:latest
    platform: linux/arm64
    container_name: douyin-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_INTERVAL: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  bot:
    <<: *app
    container_name: douyin-bot
    command: node scripts/bot-worker.js
    profiles: ["bot"]
    ports: []
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(require(\"fs\").existsSync(process.env.BOT_STORAGE_DIR||\"/app/data/runtime\")?0:1)'"]
      interval: 60s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    platform: linux/arm64
    profiles: ["db"]
    container_name: douyin-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${DB_NAME:-douyin}
      MYSQL_USER: ${DB_USER:-douyin_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - mysql-data:/var/lib/mysql
    # 宿主已跑 MySQL 时不要解注释下面这行（3306 会冲突）；容器内访问宿主用 host.docker.internal
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-change_me_root} --silent"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
