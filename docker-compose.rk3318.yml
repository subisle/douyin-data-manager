# ---------------------------------------------------------------------------
# RK3318 BOX (Rockchip RK3318 / aarch64) — Docker 29 自带 compose v2
#
# 3328 单容器：Go 后端（API + 机器人 + 自带迁移）托管 web/dist，一个端口。
#   docker compose --env-file deploy/rk3318/.env -f docker-compose.rk3318.yml up -d
#   ↑ --env-file 必须：${DB_*}/${QQ_*} 插值读它，env_file 只注入容器不参与插值
#   docker compose -f docker-compose.rk3318.yml up -d --build   # 盒子原生构建
#   docker compose -f docker-compose.rk3318.yml up -d           # 已 load 镜像
#
# 可选 profile：
#   --profile db    盒子没装 MySQL 时，用容器内 MySQL 8.4
# ---------------------------------------------------------------------------

name: douyin-rk3318

x-app: &app
  image: douyin-data-manager:arm64
  build:
    context: .
    dockerfile: Dockerfile
    platforms:
      - linux/arm64
  platform: linux/arm64
  env_file:
    - deploy/rk3318/.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    container_name: douyin-web
    labels:
      - autoheal=true
    environment:
      TZ: Asia/Shanghai
      # Go 配置走 DY_ 前缀（见 server/internal/config/config.go）
      DY_ADDR: ":3000"
      DY_WEB_DIR: /app/web
      DY_DB_HOST: ${DB_HOST:-host.docker.internal}
      DY_DB_PORT: ${DB_PORT:-3306}
      DY_DB_USER: ${DB_USER:-douyin_app}
      DY_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必填}
      DY_DB_NAME: ${DB_NAME:-douyin}
      # 机器人通道：QQ 凭据必填，微信留空则启动后在机器人页扫码
      DY_QQ_APP_ID: ${QQ_APP_ID:-}
      DY_QQ_CLIENT_SECRET: ${QQ_CLIENT_SECRET:-}
      DY_QQ_API_BASE: ${QQ_API_BASE:-https://api.sgroup.qq.com}
      DY_WEIXIN_TOKEN: ${WEIXIN_TOKEN:-}
    ports:
      - "${DOUYIN_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: ${DOUYIN_WEB_MEM:-256m}
    memswap_limit: ${DOUYIN_WEB_MEMSWAP:-384m}

  # 健康检查 unhealthy 时自动重启 web 容器（崩溃重启由 restart: unless-stopped 覆盖）
  autoheal:
    image: willfarrell/autoheal:latest
    platform: linux/arm64
    container_name: douyin-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_INTERVAL: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  mysql:
    image: mysql:8.4
    platform: linux/arm64
    profiles: ["db"]
    container_name: douyin-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${DB_NAME:-douyin}
      MYSQL_USER: ${DB_USER:-douyin_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - mysql-data:/var/lib/mysql
    # 宿主已跑 MySQL 时不要解注释下面这行（3306 会冲突）；容器内访问宿主用 host.docker.internal
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-change_me_root} --silent"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
